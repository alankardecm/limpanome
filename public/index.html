<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Limpa Nome</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="loginScreen" class="login-screen" style="display:none">
    <div class="login-card">
      <div class="login-logo">
        <i class="fas fa-shield-halved"></i>
        <h1>Limpa Nome</h1>
        <p>CRM - Acesso Restrito</p>
      </div>
      <div class="login-form">
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="loginSenha">Senha</label>
          <input type="password" id="loginSenha" placeholder="Digite a senha" autocomplete="current-password">
        </div>
        <p class="login-error" id="loginError"></p>
        <button class="btn btn-primary login-btn" id="loginBtn" onclick="Auth.login()">
          <i class="fas fa-sign-in-alt"></i> Entrar
        </button>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fas fa-shield-halved"></i>
        <span>Limpa Nome</span>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle">
        <i class="fas fa-bars"></i>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard">
        <i class="fas fa-chart-line"></i>
        <span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="clientes">
        <i class="fas fa-users"></i>
        <span>Clientes</span>
      </a>
      <a href="#" class="nav-item" data-page="processos">
        <i class="fas fa-gavel"></i>
        <span>Processos</span>
      </a>
      <a href="#" class="nav-item" data-page="tarefas">
        <i class="fas fa-tasks"></i>
        <span>Tarefas</span>
        <span class="badge" id="tarefasBadge" style="display:none">0</span>
      </a>
      <a href="#" class="nav-item" data-page="pipeline">
        <i class="fas fa-filter"></i>
        <span>Pipeline</span>
      </a>
      <a href="#" class="nav-item" data-page="precos">
        <i class="fas fa-tags"></i>
        <span>Tabela de Preços</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <i class="fas fa-user-circle"></i>
        <span id="userDisplay"></span>
      </div>
      <button class="btn-logout" onclick="Auth.logout()" title="Sair">
        <i class="fas fa-sign-out-alt"></i> Sair
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <!-- Header -->
    <header class="top-header">
      <div class="header-left">
        <button class="mobile-toggle" id="mobileToggle">
          <i class="fas fa-bars"></i>
        </button>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="header-right">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="globalSearch" placeholder="Buscar cliente (nome, CPF, telefone)...">
        </div>
        <button class="btn btn-primary" id="btnNovoCliente">
          <i class="fas fa-plus"></i> Novo Cliente
        </button>
      </div>
    </header>

    <!-- Page Content Container -->
    <div class="page-content" id="pageContent">
      <!-- Pages will be loaded here dynamically -->
    </div>
  </main>

  <!-- Modal Container -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Modal</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/clientes.js"></script>
  <script src="/js/pages/cliente-detalhe.js"></script>
  <script src="/js/pages/processos.js"></script>
  <script src="/js/pages/tarefas.js"></script>
  <script src="/js/pages/pipeline.js"></script>
  <script src="/js/pages/precos.js"></script>
  <script src="/js/app.js"></script>
  <script>Auth.init();</script>
</body>
</html>
